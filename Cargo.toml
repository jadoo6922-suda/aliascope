[package]
name = "aliascope"
version = "0.2.0"
edition = "2021"
description = "Legal OSINT CLI: public username alias discovery + free email registration signals (no passwords)"
license = "MIT"
readme = "README.md"
keywords = ["osint", "username", "breach-check", "cli", "security"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
regex = "1.10"
urlencoding = "2.1"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
