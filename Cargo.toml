[package]
name = "aliascope"
version = "0.3.0"
edition = "2021"
description = "Legal OSINT CLI: modular engines, queue, SQLite cache, JSON/CSV/HTML reports"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "socks"] }
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
regex = "1.10"
urlencoding = "2.1"
md-5 = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
strsim = "0.11"
futures = "0.3"
hickory-resolver = "0.24"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
